[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyinspect-code"
version = "0.2.1"
description = "Understand Python code without reading every line"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'"]
authors = [{name = "PyInspect Contributors"}]
license = {text = "MIT"}
classifiers = ["Programming Language :: Python :: 3", "Topic :: Software Development :: Libraries"]

[project.urls]
Homepage = "https://pyinspect-hthecrbw.manus.space/"
Documentation = "https://pyinspect-hthecrbw.manus.space/"
Repository = "https://github.com/buenoseva521-lgtm/pyinspect"
Issues = "https://github.com/buenoseva521-lgtm/pyinspect/issues"
PyPI = "https://pypi.org/project/pyinspect-code/"

[project.scripts]
pyinspect = "pyinspect.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
