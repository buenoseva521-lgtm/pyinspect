name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install '.[test]'

      - name: Run tests
        run: pytest -q

      - name: Verify package and CLI
        run: |
          python -c "import pyinspect; assert pyinspect.__version__ == '0.2.1'"
          pyinspect --help
          pyinspect verify tests/fixtures/sample_project
